monitor = , preferred, auto, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 0
    drop_shadow = false
    blur {
        enabled = true
        passes = 3
        size = 8
        new_optimizations = true
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

windowrulev2 = opacity 0.85 0.85, class:^(.*)$
windowrulev2 = blur, class:^(.*)$
