monitor = , preferred, auto, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 12
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 10
        passes = 3
        noise = 0.02
        contrast = 1.2
        brightness = 0.85
        vibrancy = 0.2
        ignore_opacity = true
        new_optimizations = true
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

windowrule = opacity 0.85 override 0.75 override 1.0 override, match:class ^(glassos)$

# Launch GlassOS in the nested preview and exit it with Super+Escape.
exec-once = glassos
bind = SUPER, ESCAPE, exit
