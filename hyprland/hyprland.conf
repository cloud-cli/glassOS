monitor = , preferred, auto, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        passes = 3
        size = 8
        new_optimizations = true
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

windowrule = opacity 0.95 override, match:class ^(glassos)$

# Launch GlassOS in the nested preview and exit it with Super+Escape.
exec-once = glassos
bind = SUPER, ESCAPE, exit
