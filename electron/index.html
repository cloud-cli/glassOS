<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:8080"
    />
    <title>GlassOS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: rgba(20, 24, 32, 0.15);
        color: rgba(255, 255, 255, 0.92);
      }

      .window {
        min-height: 100vh;
        background: rgba(20, 24, 32, 0.48);
        backdrop-filter: blur(18px);
      }

      .header {
        display: flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        -webkit-app-region: drag;
      }

      .controls {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }

      .control {
        width: 11px;
        height: 11px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }

      .close {
        background: rgba(255, 95, 86, 0.9);
      }
      .minimize {
        background: rgba(255, 189, 46, 0.9);
      }
      .maximize {
        background: rgba(39, 201, 63, 0.9);
      }

      main {
        padding: 32px 40px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 189, 46, 0.9);
        content: "";
      }

      .status[data-state="connected"]::before {
        background: rgba(39, 201, 63, 0.9);
      }
      .status[data-state="disconnected"]::before {
        background: rgba(255, 95, 86, 0.9);
      }

      .action {
        margin-top: 24px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
        cursor: pointer;
      }

      .result {
        min-height: 1.5em;
        color: rgba(255, 255, 255, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="window">
      <header class="header">
        <div class="controls" role="group" aria-label="Window controls">
          <button class="control close" type="button" aria-label="Close"></button>
          <button class="control minimize" type="button" aria-label="Minimize"></button>
          <button class="control maximize" type="button" aria-label="Maximize" title="Maximize"></button>
        </div>
      </header>
      <main>
        <h1>GlassOS</h1>
        <p>A secure, transparent desktop surface.</p>
        <p class="status" id="backend-status" data-state="connecting" role="status">Connecting to local backend…</p>
        <div>
          <button class="action" id="hostname-button" type="button" disabled>Read device hostname</button>
          <p class="result" id="hostname-result" aria-live="polite"></p>
        </div>
      </main>
    </div>
    <script src="renderer.js" defer></script>
  </body>
</html>
