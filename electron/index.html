<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassOS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: rgba(20, 24, 32, 0.15);
      color: rgba(255, 255, 255, 0.92);
    }

    .window {
      min-height: 100vh;
      background: rgba(20, 24, 32, 0.48);
      backdrop-filter: blur(18px);
    }

    .header {
      display: flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      -webkit-app-region: drag;
    }

    .controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .control {
      width: 11px;
      height: 11px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .close { background: rgba(255, 95, 86, 0.9); }
    .minimize { background: rgba(255, 189, 46, 0.9); }
    .maximize { background: rgba(39, 201, 63, 0.9); }

    main { padding: 48px; }
  </style>
</head>
<body>
  <div class="window">
    <header class="header">
      <div class="controls" aria-label="Window controls">
        <button class="control close" type="button" aria-label="Close"></button>
        <button class="control minimize" type="button" aria-label="Minimize"></button>
        <button class="control maximize" type="button" aria-label="Maximize"></button>
      </div>
    </header>
    <main>
      <h1>GlassOS</h1>
      <p>Webview UI scaffold ready.</p>
    </main>
  </div>
</body>
</html>
